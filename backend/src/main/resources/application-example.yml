# ============================================================
#  LifeShop 后端配置模板
# ============================================================
#  使用方式：
#    1. 复制本文件为同目录下的 application.yml
#       cp application-example.yml application.yml
#    2. 将下方所有 <...> 占位符替换为你自己的本地配置
#    3. application.yml 已被 .gitignore 忽略，不会提交到仓库
#
#  安全提示：请勿将真实密码、密钥、AccessKey 写入本文件并提交。
# ============================================================

server:
  port: 8080
  tomcat:
    threads:
      max: 200
    connection-timeout: 20000
    keep-alive-timeout: 60000

spring:
  application:
    name: life-shop-backend

  # ---------- 邮件服务（用于商家入驻审核结果、留言回复通知）----------
  # 以 QQ 邮箱为例，password 需填「SMTP 授权码」而非邮箱登录密码。
  # 授权码获取：QQ 邮箱 → 设置 → 账号 → 开启 SMTP 服务 → 生成授权码
  mail:
    host: smtp.qq.com
    port: 465
    username: <your-email@qq.com>
    password: <your-smtp-authorization-code>
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

  # ---------- 数据源 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/db_life_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&connectTimeout=10000&socketTimeout=30000
    username: <your-mysql-username>
    password: <your-mysql-password>
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lifeshop.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议关闭 SQL 控制台打印
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 业务自定义配置 ----------
life-shop:
  jwt:
    issuer: life-shop
    # HS256 对称密钥，建议使用 32 位以上随机字符串
    # 生成示例：openssl rand -base64 48
    secret: <your-jwt-secret-at-least-32-chars>
    expire-seconds: 7200
    token-prefix: Bearer
  upload:
    # 本地上传存储目录（相对于后端启动目录）
    base-path: ./uploads
    access-url-prefix: /uploads
    max-size-mb: 10

# ---------- 阿里云 OSS（图片上传，可选）----------
# 若不使用 OSS，可保留占位符，系统将回退为本地文件上传。
# AccessKey 获取：阿里云控制台 → 访问控制 RAM → 用户 → 创建 AccessKey
# 强烈建议使用仅具备 OSS 读写权限的 RAM 子账号，切勿使用主账号密钥。
aliyun:
  oss:
    endpoint: <your-oss-endpoint, e.g. oss-cn-hangzhou.aliyuncs.com>
    access-key-id: <your-oss-access-key-id>
    access-key-secret: <your-oss-access-key-secret>
    bucket-name: <your-oss-bucket-name>
